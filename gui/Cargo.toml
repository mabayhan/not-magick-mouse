[package]
name = "nmm-gui"
version = "0.4.1"
edition = "2024"
description = "not-magick-mouse settings window (Windows and Linux)"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
nmm-core = { version = "0.4.1", path = "../core" }

[target.'cfg(windows)'.dependencies]
nmm-platform-windows = { version = "0.4.1", path = "../windows/platform" }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# X11 and Wayland windows (both are loaded at run time, nothing to link against).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
nmm-platform-linux = { version = "0.4.1", path = "../linux/platform" }

[build-dependencies]
winresource = "0.1.34"
