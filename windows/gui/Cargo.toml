[package]
name = "nmm-gui"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
nmm-core = { version = "0.2.0", path = "../../core" }
nmm-platform-windows = { version = "0.2.0", path = "../platform" }

raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[build-dependencies]
winresource = "0.1.34"
